name: Build Nimbus

# Builds installers for macOS + Windows in the cloud.
# Trigger by pushing a version tag (e.g. `git tag v0.1.4 && git push --tags`)
# or manually from the Actions tab. Artifacts land in a draft GitHub Release.
#
# SETUP REQUIRED before first run with auto-update:
#   1. Generate a signing keypair:
#        npx tauri signer generate -w ~/.tauri/nimbus.key
#   2. Add secrets to your GitHub repo (Settings → Secrets → Actions):
#        TAURI_SIGNING_PRIVATE_KEY   <- contents of ~/.tauri/nimbus.key
#        TAURI_SIGNING_PRIVATE_KEY_PASSWORD  <- the password you chose (or "")
#   3. Copy the public key into src-tauri/tauri.conf.json → plugins.updater.pubkey
#   4. Make sure GitHub Releases are publicly downloadable
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # Run the platforms ONE AT A TIME. In parallel, both tauri-action jobs
      # race to create the draft release for the same tag and can end up making
      # TWO drafts with the assets split between them — which breaks the manifest
      # job (it only sees one platform's .sig). Sequential = the first job makes
      # the draft, the second appends to it.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          releaseName: "Nimbus ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # After both platform builds finish, generate latest.json and upload it to
  # the release so the in-app updater knows where to find the new version.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate update manifest (latest.json)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}"
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Download all .sig files the build jobs uploaded, then find each
          # platform's updater bundle by PATTERN (names vary — the mac bundle is
          # often unversioned, e.g. Nimbus_universal.app.tar.gz).
          mkdir -p sigs
          gh release download "$TAG" --repo "$GH_REPO" --pattern "*.sig" -D sigs/ 2>/dev/null || true
          ls -la sigs/ || true

          pick() { ls sigs/$1 2>/dev/null | head -1; }
          MAC_SIG_PATH=$(pick "*.app.tar.gz.sig")
          WIN_SIG_PATH=$(pick "*-setup.nsis.zip.sig"); [ -z "$WIN_SIG_PATH" ] && WIN_SIG_PATH=$(pick "*_x64-setup.exe.sig")

          MAC_SIG=$(cat "$MAC_SIG_PATH" 2>/dev/null || echo "")
          WIN_SIG=$(cat "$WIN_SIG_PATH" 2>/dev/null || echo "")
          MAC_FILE=$(basename "${MAC_SIG_PATH%.sig}" 2>/dev/null || echo "")
          WIN_FILE=$(basename "${WIN_SIG_PATH%.sig}" 2>/dev/null || echo "")

          if [ -z "$MAC_SIG" ] || [ -z "$WIN_SIG" ]; then
            echo "::error::Missing updater signature (mac='$MAC_FILE' win='$WIN_FILE'). Check createUpdaterArtifacts + signing secrets."
            exit 1
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --arg mac_sig "$MAC_SIG" \
            --arg mac_url "https://github.com/${GH_REPO}/releases/download/${TAG}/${MAC_FILE}" \
            --arg win_sig "$WIN_SIG" \
            --arg win_url "https://github.com/${GH_REPO}/releases/download/${TAG}/${WIN_FILE}" \
            '{
              version: $version,
              notes: "",
              pub_date: $pub_date,
              platforms: {
                "darwin-universal": { signature: $mac_sig, url: $mac_url },
                "windows-x86_64":   { signature: $win_sig, url: $win_url }
              }
            }' > latest.json

          gh release upload "$TAG" latest.json --repo "$GH_REPO" --clobber

          # Publish the draft and mark it latest so the updater endpoint
          # (releases/latest/download/latest.json) actually points at it.
          # tauri-action leaves the release as a draft; without this every
          # release needs a manual publish. The make_latest flag is applied a
          # second time on its own because a combined patch intermittently
          # doesn't move the "latest" pointer.
          RID=$(gh api "repos/${GH_REPO}/releases" --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)
          gh api -X PATCH "repos/${GH_REPO}/releases/${RID}" -f draft=false -f make_latest=true >/dev/null
          gh api -X PATCH "repos/${GH_REPO}/releases/${RID}" -f make_latest=true >/dev/null
          echo "Published $TAG (release $RID) and set as latest."
