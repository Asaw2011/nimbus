name: Release

# Builds Nimbus for macOS (Apple Silicon + Intel), Windows, and Linux and
# publishes the installers to a GitHub Release. Triggered by pushing a tag
# like `v1.0.0`, or manually from the Actions tab.
#
# The release is built as a DRAFT and only published by the last job, once
# every platform has uploaded. The app's updater reads
# releases/latest/download/latest.json, and each platform job rewrites that
# file as it finishes; publishing up front made "latest" a half-uploaded
# release for the ~10 minutes of the build, so update checks in that window
# failed (missing, partial or empty latest.json). A draft is invisible to
# "latest", so users keep seeing the previous complete release until this one
# is whole - and if any platform fails, nothing is published at all.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon (arm64)
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # Intel (x86_64)
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Nimbus v__VERSION__"
          releaseBody: "Pick the one file for your system below. macOS: right-click the app and choose Open the first time. Windows: More info → Run anyway. See the release notes for details."
          releaseDraft: true
          prerelease: false
          # tauri.updater.conf.json only sets bundle.createUpdaterArtifacts, and
          # it is applied HERE rather than in tauri.conf.json on purpose: Tauri
          # refuses to build updater artifacts without TAURI_SIGNING_PRIVATE_KEY,
          # which exists only as a repo secret. In the main config it would break
          # every local `npm run tauri build`.
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json

  # Publish the draft only after every platform job above succeeded.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          tag="$TAG"
          if [ -z "$tag" ]; then tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"; fi
          echo "Publishing $tag"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
